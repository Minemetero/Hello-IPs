name: Build

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka scapy

      - name: 📥 Pre-install Dependency Walker
        shell: powershell
        run: |
          $dependsUrl = "https://dependencywalker.com/depends22_x64.zip"
          $zipPath = "$env:TEMP\depends.zip"
          $extractPath = "$env:LOCALAPPDATA\Nuitka\Nuitka\Cache\downloads\depends\x86_64"
          Invoke-WebRequest -Uri $dependsUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          Write-Host "✅ Dependency Walker installed at $extractPath"

      - name: 🔨 Build executable with Nuitka
        shell: powershell
        run: |
          nuitka main.py `
            --standalone `
            --onefile `
            --enable-plugin=tk-inter `
            --include-data-dir=data=data `
            --windows-console-mode=disable `
            --output-filename=hello_ips.exe

      - name: 📎 Calculate SHA-256 Hash (Windows)
        shell: powershell
        run: |
          $hash = Get-FileHash hello_ips.exe -Algorithm SHA256
          $hash.Hash | Out-File -FilePath sha256sum_windows.txt -Encoding ascii
          Get-Content sha256sum_windows.txt

      - name: 📤 Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            hello_ips.exe
            sha256sum_windows.txt

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka scapy

      - name: 🔨 Build application bundle with Nuitka
        run: |
          python -m nuitka main.py \
            --standalone \
            --macos-create-app-bundle \
            --enable-plugin=tk-inter \
            --include-data-dir=data=data \
            --output-filename=hello_ips \
            --disable-ccache \
            --macos-app-icon=none \
            --macos-disable-console

      - name: 🔍 Verify app bundle creation
        run: |
          if [ ! -d "main.app" ]; then
            echo "App bundle not created. Listing directory contents:"
            ls -la
            exit 1
          fi
          echo "✅ App bundle created successfully"

      - name: 📦 Create DMG package
        run: |
          mkdir -p dmg_contents
          cp -r main.app dmg_contents/
          hdiutil create -volname "Hello IPs" -srcfolder dmg_contents -ov -format UDZO hello_ips.dmg

      - name: 📎 Calculate SHA-256 Hash (macOS)
        run: |
          # Calculate hash for DMG
          shasum -a 256 hello_ips.dmg > sha256sum_macos_dmg.txt
          
          # Calculate hash for app bundle by creating a tar archive first
          tar -czf main.app.tar.gz main.app
          shasum -a 256 main.app.tar.gz > sha256sum_macos_app.txt
          
          # Display the hashes
          echo "DMG Hash:"
          cat sha256sum_macos_dmg.txt
          echo "App Bundle Hash:"
          cat sha256sum_macos_app.txt

      - name: 📤 Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            main.app
            hello_ips.dmg
            main.app.tar.gz
            sha256sum_macos_dmg.txt
            sha256sum_macos_app.txt

  create-release:
    name: Create Release
    needs: [build-windows, build-macos]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 🗑️ Delete existing release and tag (if any)
        continue-on-error: true
        run: |
          gh release delete build -y || echo "No release to delete"
          git push --delete origin build || echo "No tag to delete"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Prepare release notes
        run: |
          echo "Windows SHA-256:" > release_notes.txt
          cat artifacts/windows-artifacts/sha256sum_windows.txt >> release_notes.txt
          echo -e "\nmacOS DMG SHA-256:" >> release_notes.txt
          cat artifacts/macos-artifacts/sha256sum_macos_dmg.txt >> release_notes.txt
          echo -e "\nmacOS APP Bundle SHA-256:" >> release_notes.txt
          cat artifacts/macos-artifacts/sha256sum_macos_app.txt >> release_notes.txt

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build
          name: build
          body_path: release_notes.txt
          draft: false
          prerelease: false
          files: |
            artifacts/windows-artifacts/hello_ips.exe
            artifacts/macos-artifacts/hello_ips.dmg
            artifacts/macos-artifacts/main.app.tar.gz
            artifacts/windows-artifacts/sha256sum_windows.txt
            artifacts/macos-artifacts/sha256sum_macos_dmg.txt
            artifacts/macos-artifacts/sha256sum_macos_app.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
