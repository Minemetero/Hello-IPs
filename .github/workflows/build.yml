name: Build

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    name: Build with Nuitka
    runs-on: windows-latest

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka scapy

      - name: 📥 Pre-install Dependency Walker
        shell: powershell
        run: |
          $dependsUrl = "https://dependencywalker.com/depends22_x64.zip"
          $zipPath = "$env:TEMP\depends.zip"
          $extractPath = "$env:LOCALAPPDATA\Nuitka\Nuitka\Cache\downloads\depends\x86_64"
          Invoke-WebRequest -Uri $dependsUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          Write-Host "✅ Dependency Walker installed at $extractPath"

      - name: 🔨 Build executable with Nuitka
        shell: powershell
        run: |
          nuitka main.py `
            --standalone `
            --onefile `
            --enable-plugin=tk-inter `
            --include-data-dir=data=data `
            --windows-console-mode=disable `
            --output-filename=hello_ips.exe

      - name: 📎 Calculate SHA-256 Hash
        shell: powershell
        run: |
          $hash = Get-FileHash hello_ips.exe -Algorithm SHA256
          $hash.Hash | Out-File -FilePath sha256sum.txt -Encoding ascii
          Get-Content sha256sum.txt

      - name: 📤 Upload executable and hash
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            hello_ips.exe
            sha256sum.txt

      - name: 🧾 Extract SHA256 for release notes
        id: extract_hash
        shell: powershell
        run: |
          $hash = Get-Content sha256sum.txt
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append

      - name: 🗑️ Delete existing release and tag (if any)
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'

          gh release delete build -y
          if ($LASTEXITCODE -ne 0) {
            Write-Host "⚠️ No release to delete"
          }

          git push --delete origin build
          if ($LASTEXITCODE -ne 0) {
            Write-Host "⚠️ No tag to delete"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build
          name: build
          body: |
            This is the latest auto build.

            SHA-256: ${{ steps.extract_hash.outputs.sha256 }}
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            hello_ips.exe
            sha256sum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
